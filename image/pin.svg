<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="100%" stop-color="#bb001a"/>
    </linearGradient>
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0011"/>
      <stop offset="100%" stop-color="#cc0004"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Rim -->
  <circle cx="100" cy="100" r="90" fill="url(#rimGradient)"  />

  <!-- Main Red Button Face -->
  <circle cx="100" cy="100" r="80" fill="url(#redGradient)" />

  <!-- Top Gloss Highlight -->
  <g transform="rotate(-35 100 100)">
    <path
      d="M 30 100 A 70 70 0 0 1 170 85 A 75 75 0 0 0 30 100 Z"
      fill="url(#rimGradient)"
    />
  </g>

  <!-- Crisp Inner Border Ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#ff8095" stroke-width="14"  />

  <!-- Pure Vector Brackets (Zero <text> tags = 100% Overleaf / Inkscape Proof) -->
  <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Brace { -->
    <path d="M 84,68 C 72,68 68,74 68,82 L 68,91 C 68,96 61,100 54,100 C 61,100 68,104 68,109 L 68,118 C 68,126 72,132 84,132" transform="translate(7, 0)" />
    <!-- Right Brace } -->
    <path d="M 116,68 C 128,68 132,74 132,82 L 132,91 C 132,96 139,100 146,100 C 139,100 132,104 132,109 L 132,118 C 132,126 128,132 116,132" transform="translate(-7, 0)" />
  </g>
</svg>
